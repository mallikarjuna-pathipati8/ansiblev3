- name: fetch from aws secret manager
  hosts: local
  conection: local
  become: yes
  tasks:
    - name: get the secret keys from aws
      debug:
        msg: "{{ lookup('amazon.aws.aws_secret','roboshop/dev/ansible',region='us-east-1')| from_json | json_query ('ansible_user') }}"

    - name: get the secret keys from aws
      debug:
        msg: "{{ lookup('amazon.aws.aws_secret','roboshop/dev/ansible',region='us-east-1')| from_json | json_query ('ansible_password') }}"
