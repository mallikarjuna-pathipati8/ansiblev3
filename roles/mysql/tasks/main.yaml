- name: enable mysql 8.4
  command: dnf module enable mysql:8.4 -y

- name: install mysql-server
  package:
    name: mysql-server
    state: present

- name: start and enable mysqld
  service:
    # name: "{{ app_name }}"
    name: mysqld
    state: started
    enabled: yes

- name: set root password for mysql
  # command: mysql_secure_installation --set-root-pass "{{ mysql_root_password }}"
  command: mysql_secure_installation --set-root-pass RoboShop@1
