- name: disable nodejs default 16 version
  command: dnf module disable nodejs -y

- name: enable nodejs 24 version
  command: dnf module enable nodejs:24 -y

- name: install nodejs 24
  package:
    name: "{{ node_app_name }}"
    state: present

- name: check nodejs version
  command: node -v

- name: create system user
  user:
    name: roboshop
    create_home: false
    home: /app
    system: true
    shell: /sbin/nologin
    comment: "roboshop system user"
- name: remove existing /app directory
  file:
    path: /app
    state: absent

- name: remove existing catalogue.zip file
  file:
    path: /tmp/catalogue.zip
    state: absent

- name: create /app directory
  file:
    path: /app
    state: directory

- name: download catalogue application
  get_url:
    url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-{{ node_app_version }}.zip
    dest: /tmp/catalogue.zip

- name: unarchive catalogue application
  unarchive:
    src: /tmp/catalogue.zip
    dest: /app
    remote_src: yes

- name: install npm dependencies
  community.general.npm:
    path: /app
    state: present

- name: copy catalogue.service file
  template:
    src: catalogue.service.j2
    dest: /etc/systemd/system/catalogue.service

- name: copy mongo repo
  copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: install mongodb client
  dnf:
    name: mongodb-mongosh
    state: present

- name: check products loaded or not
  command: mongosh --host '{{ mongodb_host }}' --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
  register: product_count

- name: print product count
  debug:
    msg: "{{ product_count }}"

- name: load product data
  shell: mongosh --host "{{ mongodb_host }}" </app/db/master-data.js
  when: product_count.stdout | int ==0

- name: system daemon reload
  systemd_service:
    daemon_reload: true

- name: start and enable catalogue
  service:
    name: catalogue
    state: restarted
    enabled: yes
