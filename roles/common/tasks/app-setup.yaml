- name: create system user
  user:
    name: roboshop
    create_home: false
    home: /app
    system: true
    shell: /sbin/nologin
    comment: "roboshop system user"

- name: remove existing /app directory
  file:
    path: /app
    state: absent

- name: remove existing {{ component }}.zip file
  file:
    path: /tmp/{{ component }}.zip
    state: absent

- name: create /app directory
  file:
    path: /app
    state: directory

- name: download {{ component }} application
  get_url:
    url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/{{ component }}-{{ node_app_version }}.zip
    dest: /tmp/{{ component }}.zip

- name: unarchive {{ component }} application
  unarchive:
    src: /tmp/{{ component }}.zip
    dest: /app
    remote_src: yes


