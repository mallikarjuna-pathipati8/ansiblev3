- name: Launch an EC2 instance
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    region: us-east-1
    instance_type: t3.small
    image_id: ami-0055977a6e828a4f4 # Replace with your target AMI ID
    instance:
      [
        "mongodb",
        "redis",
        "mysql",
        "rabbitmq",
        "catalogue",
        "user",
        "cart",
        "shipping",
        "payment",
        "frontend",
      ]
    ec2_action: create
    domain_name: "arjundaws92s.store"
    hosted_zone: "Z08325212T4ZKWPRKKKQC"

  tasks:
    - name: Create EC2 instance
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        region: "{{ region }}"
        instance_type: "{{ instance_type }}"
        security_groups:
          - roboshop-common
          - "roboshop-{{ item }}"
        image_id: "{{ image_id }}"
      loop: "{{ instance }}"
      when: ec2_action =="create"
      register: ec2_output

    - name: Create or update Route 53 A record
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{item.item}}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when: ec2_action == "create"

    - name: create R53 record for frontend
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].public_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when: ec2_action == "create" and item.item == "frontend"

    - name: delete Route 53 A record
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{item}}.{{ domain_name }}"
        type: A
        ttl: 1
      loop: "{{ instance }}"
      when: ec2_action == "delete"

    - name: delete EC2 instance
      amazon.aws.ec2_instance:
        state: absent
        name: "roboshop-{{ item }}"
        region: "{{ region }}"
        wait: false
      loop: "{{ instance }}"
      when: ec2_action =="delete"
